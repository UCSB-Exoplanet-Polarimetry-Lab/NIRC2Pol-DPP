# Reduction config for NIRC2Pol-DPP.
#
# Every option this pipeline takes, with its default. Delete a
# line to accept the default; set it to "none" to switch the
# option off, which is not always the same thing.
#
# Instrument constants (plate scale, detector epochs, beam
# geometry seed) are NOT here -- they live in
# nirc2pol/instruments/nirc2.toml, because they are
# properties of the instrument rather than choices about
# this reduction.

[paths]
# Where the raw frames actually are. Read only -- the pipeline never
# writes here, so this can be an archive or shared space you do not own.
# The frames it reads are symlinked into reductions_root/raw/.
raw_data_folder = "/path/to/raw/frames"

# Where THIS reduction is written: raw/ (links), reduced/, plots/,
# sequences/ and the masters. One folder per reduction, so two goes at the
# same night do not overwrite each other.
reductions_root = "/path/to/my_reduction"

# The night, as DATE-OBS records it: UTC. A Keck night runs 04:00-16:00
# UTC, so one UTC date names a whole night, one day after the HST evening.
# It locates nothing -- it names the masters, log and frame table, and is
# checked against the frames' own DATE-OBS.
date = "2025-12-08"

# Names the output files only. What the reduction covers is set by
# select_target / select_frame_range.
target = "AB_Aur"

[selection]
# Keep only frames whose TARGNAME matches, ignoring case, spaces,
# underscores and hyphens. none keeps everything.
select_target = "none"

# Which raw files to consider at all, as inclusive observation numbers
# read from the filenames -- one range [857, 993] or several. This is not
# the same question as select_frame_range: raw_range decides what is read
# off disk and sorted into darks, flats and science, so it has to be wide
# enough to include the calibrations. none reads every raw file in the
# night folder, which is what you want unless the folder holds more than
# one night's worth.
raw_range = "none"

# Keep only these observation numbers, read from the filenames. One range
# [932, 939], or several [[857, 900], [915, 930]]. Inclusive. none keeps
# everything.
select_frame_range = "none"

[background]
# How the sky/thermal background is removed, per Wollaston beam, inside
# the Stokes builder.
#
#   mean_box   the mean of a fixed box, set in background_box. Wants a
#       corner with no source in it.
#   annulus    the median of an annulus around the star, set in
#       background_annulus. Follows a background that varies across the
#       frame better than a box in one corner.
#   dither     subtract the matching dithered exposure, so the sky is
#       measured at the same time as the source. Needs a dither pattern in
#       the data.
#   none       leave it in.
#
# Several may be chained, in the order applied, e.g.
#   background_method = ["dither", "annulus"]
#
# That combination is the one to reach for at L'. The dither removes the
# thermal pedestal AND its structure, which nothing else can, but it
# leaves a residual because the sky changed a little between the two
# exposures -- roughly a constant offset per beam. The annulus (or
# mean_box) then takes that out. On the 2025-12-06 standard the leftover
# was worth +22 ADU/px in U at the star, which is nothing beside a 1.2e5
# core but sums over a 9000 px annulus into more signal than the star has
# out there.
#
# dither must be listed first if present: it runs on whole frames before
# the beams are cut out, so any other order is refused rather than quietly
# rearranged.
#
# L'/M want dither or mean_box, where the thermal background dominates;
# JHK want annulus or mean_box. Defaults to none because the right answer
# depends on the band and the data, and the region a box or annulus uses
# cannot be guessed -- a choice to make, not one to inherit. On-sky data
# almost always needs one.
background_method = "none"

# How far apart two pointings may be and still count as the same dither
# position -- used ONLY when a frame has no RAOFF/DECOFF and the actual
# RA/DEC has to be used instead. Commanded offsets carry no jitter, so
# they are compared exactly.
#
# Keep this well BELOW the dither throw. A throw is only a few arcsec --
# 3.0 on the 2025-12-06 L' data -- and a tolerance near it merges the two
# positions into one, leaving nothing to subtract. That is raised rather
# than passed over. [arcsec]
dither_tolerance = 2.0

# [ylow, yhigh, xlow, xhigh] for mean_box, in a source-free corner. [px]
background_box = "none"

# [r_inner, r_outer] for annulus. [px]
background_annulus = "none"

# Do NOT subtract the master skies from each science frame. Reads as a
# double negative next to use_master_skies, and the two pair up:
# use_master_skies decides whether the masters are BUILT, this decides
# whether they are APPLIED. Both defaults off, so the sky is removed by
# background_method inside the Stokes builder instead -- per Wollaston
# beam, which is where it belongs. Set use_master_skies = true and
# skip_sky_sub = false to subtract a master sky frame the old way.
skip_sky_sub = true

# Subtract dedicated master sky frames. Off by default: combined with a
# mean-box or annulus background it removes the pedestal twice.
use_master_skies = false

[calibration]
# Override which KIND of flat this band requires -- SKY (twilight) or DOME
# (the dome screen). The instrument sets this per band already: sky at
# L'/M, where the dome lamp is swamped by the thermal background, and dome
# at JHK. none keeps that rule.
#
# Reducing with the wrong kind gives a wrong answer that still looks
# reasonable, so the rule is enforced rather than preferred -- a mismatch
# raises. Set this when you have a considered reason, such as sky flats
# being the only usable ones you took in JHK.
# choices: 'SKY', 'DOME', none
required_flat_type = "none"

# Build a master flat even when no dark matches its exposure, tagging it
# +NODARK. On by default, because darks are routinely not taken for every
# flat and refusing meant a reduction stopped over a flat in a band it was
# never going to use.
#
# What keeps this safe is the ranking, not the flag: within a filter a
# +NODARK flat loses to EVERY dark-subtracted flat of the required type,
# even a non-polarimetric one built from far fewer frames. It is used only
# when nothing better exists in that filter -- and then it is the only
# alternative to no flat at all. It still warns when built, and the frame
# it calibrates records FLATTYPE ending +NODARK, because the dark current
# it carries survives normalization and divides into everything.
allow_flat_without_dark = true

# Downgrade a wrong-kind flat from an error to a warning, and reduce with
# it anyway. The frame records FLATMISM so the product says it happened.
# Where required_flat_type changes WHICH kind is demanded, this stops the
# demand being enforced at all -- so prefer setting required_flat_type
# when you know what you want.
allow_flat_type_mismatch = false

# Reduce with no flat at all, dividing by ones. Off by default because it
# leaves the detector response in the data and is easy to miss afterwards.
allow_no_flat = false

# Fewest frames that can make a master dark, flat or sky. A group smaller
# than this is skipped with a warning -- and if that leaves no master at
# all, the reduction carries on without one, so a night short of
# calibration frames is quiet rather than fatal. Lower it deliberately,
# knowing a two-frame master barely rejects a cosmic ray.
master_min_frames = 3

# How bad pixels are filled once identified.
#
#   interpolation  from the neighbours, which keeps a gradient across the
#       pixel.
#   median         the median of the surrounding box, which is flatter but
#       more robust where a whole region is bad.
replacement_method = "interpolation"

[skies]
# How far the telescope may move before its sky frames count as a
# different set. Sky sets used to be merged whenever their exposure
# settings matched, whatever the telescope was pointing at, so three sets
# at three targets became one master and no later choice could recover
# them. [arcsec]
sky_group_radius = 60.0

# How long a pause may be before the sky frames after it count as a
# different set. Position alone cannot separate two sets at the same place
# hours apart, and on L' the thermal background has moved on by then.
# [min]
sky_group_gap = 30.0

# Warn when the nearest usable sky is further from the science frame than
# this. A sky that far off measures a different piece of atmosphere, and
# on L' the sky is most of what is being subtracted. [arcsec]
sky_max_radius = 600.0

[geometry]
# Where split_beams cuts the top beam out, if you are overriding it. none
# uses the nominal value for the band, which is the intended path.
#
# This is NOT a calibration and does not need to be exact. Whatever offset
# the cut leaves between the two beams is measured and removed per frame
# by align_beams during registration. Set it only if a beam is being cut
# off entirely -- which would mean the band is missing from the
# [beam_geometry] table in nirc2.toml. [px]
beam_top_row = "none"

# See beam_top_row. [px]
beam_x_offset = "none"

# How the star is located, so both Wollaston beams can be shifted onto the
# image centre together. The right one depends on what the source looks
# like, and the wrong one fails quietly -- a centre off by a pixel leaks
# disk signal straight into U_phi.
#
#   smooth_peak    a point source. Peak of the Gaussian-smoothed image,
#       refined by a Gaussian fit. No guess or tuning needed.
#   min            a SATURATED core. The centre reads dark, so smooth_peak
#       hops between rim maxima of the donut and doubles the PSF; this
#       takes the darkest pixel near the core instead.
#   wings          behind a CORONAGRAPH. Masks the core, which carries no
#       position information, and aligns on the wings.
#   symmetry       a round RESOLVED body (planet, moon). Cross-correlates
#       the image with its own 180-degree rotation; needs no template,
#       threshold or guess.
#   silhouette     a resolved body with hotspots or albedo features.
#       Geometric centre of the thresholded region, ignoring how bright
#       each part of it is.
#   centroid       an extended source. Flux-weighted centroid above a
#       threshold; still pulled about by bright surface features.
#   crosscorr      aligning a sequence to one reference. Needs a template=
#       image, so it is not usable from this file alone.
#   gaussian       a 2D Gaussian fit, seeded from quantile_peak.
#   quantile_peak  the brightest pixel, ignoring outliers -- robust to
#       isolated hot pixels where max is not.
#   max            the brightest pixel, full stop.
#   none           do not register at all. For a source too faint to find
#       in a single frame.
#
# nirc2pol.reduction.registration documents the algorithms themselves, and
# takes any callable f(data) -> (cy, cx) too.
register_method = "smooth_peak"

[fast_axis]
# How theta_off is obtained. mm_model takes it from the Mueller matrix
# model, which settles the IP too (so ip_method must also be mm_model) and
# is NOT IMPLEMENTED yet -- it raises. butterfly fits it from the data.
# fixed uses theta_off below.
# choices: 'mm_model', 'butterfly', 'fixed'
fast_axis_method = "mm_model"

# Fast axis offset, used when fast_axis_method = fixed. There is no
# trusted automatic source: an HWP ladder on an internal source returns
# theta_off + chi/2 with chi unknown. [deg]
theta_off = "none"

# [r_inner, r_outer] annulus for the butterfly fit. This works on U_phi,
# where a tangentially polarized disk contributes nothing by definition,
# so it should SPAN the disk and need only clear the core. [px]
fit_radii = [25.0, 150.0]

[instrumental_polarization]
# How the I -> Q/U leakage is measured, named <method>_<scope>: the scope
# is also the level it is applied at. mm_model is NOT IMPLEMENTED and
# raises. Both fit_uphi routes ASSUME AN AZIMUTHALLY POLARIZED SOURCE and
# return a confident, meaningless number where that is the hypothesis
# under test. none leaves it uncorrected.
#
# The leakage, instrumental polarization and IP are three names for the
# same thing: the optics turning a little of I into Q and U, so an
# unpolarized source comes out with Q = ipq*I and U = ipu*I. The prose
# says leakage, the identifiers say ip.
#
# APPLIED BY polmode.run, not by configure(). This names a procedure
# rather than a value, and the value it produces -- an
# InstrumentalPolarization -- is what build_stokes_cubes takes as ip=. So
# a script or notebook that configures an instrument and builds Stokes
# cubes itself gets NO correction from setting this: it has to run the fit
# and pass the result. See examples/run_step_by_step.ipynb, stage 8, which
# does. Unlike background_method, this cannot be applied for you -- the
# fit needs theta_off as an input and every cycle at once, so there is no
# per-frame hook to hang it on.
# choices: 'mm_model', 'fit_uphi_per_cycle', 'fit_uphi_all', none
ip_method = "mm_model"

# Radius excluded from the fit_uphi annulus, covering the saturated or
# occulted core. [px]
ip_mask_radius = 22.0

[products]
# Keep the master darks/flats/skies and every dark-, flat- and bad-pixel-
# corrected science frame. They are built either way, since nothing
# downstream can run without them; this only says whether they are
# written. Turn it off for a quick re-reduction whose calibration is
# already on disk.
save_preproc = true

# Overwrite products already in the reduction folder. On by default, so
# re-running a reduction replaces its own output rather than failing
# halfway. Turn it off to make a folder write-once, and a second run will
# stop rather than quietly replace what is there.
overwrite_products = true

# Write PI, AoLP and DoLP -- polarized intensity, and the angle and degree
# of linear polarization. These mean something for any source, so they are
# on by default.
save_derived_quantities = true

# Write Q_phi and U_phi. Off by default because they are defined about a
# CENTRE: they mean something when the light is scattered from something
# at that centre, which is to say a disk. For a point source -- a
# polarization standard, say -- they are a rotation of Q and U about an
# arbitrary point, and Q_phi is not a measurement of anything. Turn it on
# for a disk, where U_phi is also the null channel worth judging the
# reduction by.
save_radial_stokes = false

# Side length of the final crop, in pixels. none DERIVES one, which is the
# intended path -- you should not normally set this.
#
# A dithered frame carries a NEGATIVE copy of the source where the partner
# exposure had it. On the 2025-12-06 Io data that ghost is 290-316 px away
# and as deep as the source is bright, and it survives median-combining at
# half strength: the bright-object-and-dark-object image. Cropping inside
# the throw removes it.
#
# Derived from the dither throw (the commanded offsets, over the plate
# scale) and the source's own radius at 90% of its flux, so it needs
# nothing from you and cannot be off by a unit conversion. Set a value
# only to keep a specific field, or 0 to disable cropping and leave any
# ghost in. Nothing is cropped when the data was not dithered. [px]
crop_size = "none"

# DoLP is written as NaN wherever |I| is below this fraction of the peak.
# DoLP is PI/I, so where I approaches zero -- most of a frame, once the
# background is gone -- it divides noise by noise and runs to enormous
# values that leave any display scaled by them showing nothing. Nothing is
# hidden: a ratio at I close to 0 carried no information. Raise it for a
# faint source, or set 0 to divide everywhere.
dolp_min_intensity = 0.001

# Keep the per-cycle Stokes cubes -- one FITS per HWP cycle in
# <target>_stokes_cycles/, each carrying its own cycle's header. Off, the
# median cube and the derived products are all that is written, and no
# cycle can be dropped or re-combined afterwards without reducing the
# night again.
save_individual_cycles = true
