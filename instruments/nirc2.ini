# NIRC2 instrument constants for NIRC2Pol-DPP.
#
# Everything in this file is a measured or documented property of the
# instrument itself, never a choice about how to reduce a particular dataset.
# Reduction choices stay as arguments to the reduction functions, and
# per-dataset settings stay on the instrument instance. The test for whether
# something belongs here: would two people reducing different targets on the
# same night both want the same value? If yes it is an instrument constant.
#
# Logic does not live here either. Anything with a conditional in it -- how a
# band is read off a header, how frames are sorted by type, the polarimetric
# rotation model -- stays in nirc2.py, because a config file that grows an
# if-statement has become a program in a language with no debugger.

[instrument]
name          = NIRC2
plate_scale   = 0.009942   ; arcsec / pixel, narrow camera
zp_offset     = -0.262     ; deg, narrow camera zero point, Service et al. 2016
flat_elevation = 45.0      ; deg, the dome flat position

[observatory]
# Keck II, for parallactic and north angle calculations
latitude  = 19.82525
longitude = -155.468889

[polarimetry]
modulator_keyword     = PCUPR
rotator_keyword       = ROTPDEST
modulator_cycle_length = 4
critical_angles       = 0.0, 45.0, 22.5, 67.5
# Frames before this date carry no PCUPR keyword and the HWP angle has to be
# recovered from OBJECT.
pol_header_epoch      = 2025-12-01

[detector]
# The NIRC2 detector was replaced on this date; gain and saturation differ
# either side of it.
swap_date            = 2023-11-20
gain_before          = 4.0
gain_after           = 8.0
saturation_before    = 9000.0
saturation_after     = 4500.0
readnoise_sampmode_2 = 50.0
readnoise_sampmode_3 = 15.0
readnoise_default    = 0.0

[background]
# Recommended background methods per band, best first. L' and M sit on a
# large structured thermal pedestal and need dithers or at least a mean box;
# in JHK an annulus around the source is usually cleanest.
Lp = dither, mean_box
L  = dither, mean_box
Ms = dither, mean_box
M  = dither, mean_box
J  = annulus, mean_box
H  = annulus, mean_box
K  = annulus, mean_box
Kp = annulus, mean_box
Ks = annulus, mean_box

[flat_exceptions]
# Filters that may legitimately be flatted with a different filter's flat.
NB2.108 = K + clear, Ks + clear, Kp + clear

# ---------------------------------------------------------------------------
# Beam extraction geometry, per epoch.
#
# The Wollaston puts two beams on the detector and their separation is not
# constant across epochs. A wrong value here is silent and unrecoverable:
# registration shifts both beams together to preserve their relative
# alignment, so the offset survives into the double difference as a dipole.
# There is therefore no fallback entry and no default -- an unmatched frame
# raises rather than guessing.
#
# Each section needs a date range and the bands it was measured for, because
# it is not yet established whether the separation tracks the date (mechanical
# drift) or the band (a Wollaston splits by wavelength). Until that is known,
# an entry claims only the conditions it was actually measured under.
#
# Measure a new epoch with:
#     instrument.fit_beam_geometry(frame, top_guess, x_guess)
# on a frame with a bright compact source, background subtracted.

[beam_geometry.2025-12_lprime]
from_date     = 2025-12-01
to_date       = 2025-12-31
bands         = Lp, L
top_row_start = 504
beam_x_offset = 12
beam_height   = 450
measured_from = AB Aur 2025-12-07, 8 frames, fit_beam_geometry
notes = Sub-pixel measurement is (504.24, 12.51), scatter 0.05 px across the
    sequence. The x offset is a genuine half-pixel tie; 12 was chosen over 13
    because it gives lower U_phi (16.3 against 17.7). Supersedes the
    commissioning value (508, 13), which was wrong by 3.8 rows.

# Earlier work recorded roughly (536, 14) for 2026 H and (529-530, 13-15) for
# the 2026 Kp nights. Those are deliberately NOT entered here: they were never
# re-measured with fit_beam_geometry, and the one comparable number that was
# checked (508, 13) turned out wrong. Measure them and add sections rather
# than trusting them.
